name: Android

# MyDayCompanion native Android gate (product override of the template's Expo/web stack; see CLAUDE.md).
# Runs next to the template's ci.yml, which keeps the repo-wide Gitleaks, Semgrep and OSV scans.
# Steps: wrapper validation → unit, integration, Compose UI, security and golden AI-evaluation tests →
# Android lint (static analysis) → debug APK → check the merged APK has no network permission.
on:
  pull_request:
    branches: [development, staging, production]
  push:
    branches: [development, staging, production]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate the Gradle wrapper jar against the official checksum
        run: |
          version="$(sed -n 's#.*gradle-\([0-9.]*\)-bin.zip#\1#p' gradle/wrapper/gradle-wrapper.properties)"
          expected="$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")"
          echo "${expected}  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Keep a copy of the committed Room schemas
        run: mkdir -p "$RUNNER_TEMP/schemas" && cp -R data/schemas/. "$RUNNER_TEMP/schemas/"

      - name: Unit, integration, UI, security and AI-evaluation tests
        run: ./gradlew --stacktrace :domain:test :data:testDebugUnitTest :app:testDebugUnitTest

      - name: Print exported Room schema (for committing to data/schemas)
        if: always()
        run: find data/schemas -name '*.json' -print -exec cat {} \; || true

      - name: Room schema drift check
        run: |
          python3 - "$RUNNER_TEMP/schemas" data/schemas <<'PY'
          import json, pathlib, sys
          committed, generated = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          bad = []
          for g in sorted(generated.rglob("*.json")):
              rel = g.relative_to(generated)
              c = committed / rel
              if not c.exists():
                  bad.append(f"{rel}: new schema not committed")
              elif json.loads(c.read_text()) != json.loads(g.read_text()):
                  bad.append(f"{rel}: differs from the committed schema (bump MdcDatabase.VERSION and add a Migration)")
          for line in bad:
              print(f"::error::{line}")
          sys.exit(1 if bad else 0)
          PY

      - name: Static analysis (Android lint)
        run: ./gradlew --stacktrace lintDebug

      - name: Build debug APK
        run: ./gradlew --stacktrace :app:assembleDebug

      - name: Local-first check on the merged APK manifest
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee permissions.txt
          if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE)" permissions.txt; then
            echo "::error::The APK requests network access. V1 must have no network path."
            exit 1
          fi

      - name: Upload debug APK (for installing on a test phone)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mydaycompanion-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-reports
          path: |
            domain/build/reports/
            data/build/reports/
            app/build/reports/
            data/schemas/
            permissions.txt
          if-no-files-found: ignore

  dependency-scan:
    # The template's OSV job cannot see Gradle dependencies without a lockfile, so this job writes one
    # for the shipped (release runtime) classpath and scans it. Report-only in Phase 0; blocking from alpha.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Resolve and lock shipped dependencies
        run: ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --write-locks
      - name: OSV-Scanner on the lockfile
        run: docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:latest scan source -L /src/app/gradle.lockfile | tee osv-report.txt
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-dependency-report
          path: |
            app/gradle.lockfile
            osv-report.txt
          if-no-files-found: ignore
