name: Staging tests

# Full functional + non-functional automation (web AND Android) against a deployed environment
# (staging by default; never production). Runs after every staging deploy
# (called from deploy.yml) and on demand. It never fails silently: every
# suite uploads its raw results, a report job merges them into summary.md /
# summary.json (artifact "staging-test-report"), writes the job summary and
# opens one GitHub issue per failing run. /test downloads that artifact,
# logs the bugs in tests/bugs/bug-log.xlsx and asks what to fix.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'dev | staging (never production)'
        default: staging

concurrency:
  group: staging-tests-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.u.outputs.url }}
    steps:
      - id: u
        env:
          URL_DEV: ${{ vars.DEV_URL }}
          URL_STAGING: ${{ vars.STAGING_URL }}
          TARGET: ${{ inputs.environment || 'staging' }}
        run: |
          case "$TARGET" in
            dev) url="$URL_DEV" ;;
            staging) url="$URL_STAGING" ;;
            *) echo "::error::only dev or staging may be tested"; exit 1 ;;
          esac
          [ -n "$url" ] || { echo "::error::set the repository variable for this environment's URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

  web-e2e:
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Functional specs + @nfr specs (axe accessibility, offline, visual, headers).
      - run: npx playwright test -c tests/web/playwright.config.ts --project=chromium --project=pixel7 || echo "::warning::Playwright reported failures"
        env:
          BASE_URL: ${{ needs.target.outputs.url }}
          # self-healing game day (tests/web/specs/self-healing.nfr.spec.ts); the ops endpoints refuse production
          OPS_TOKEN: ${{ secrets.OPS_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-web-e2e
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-html-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

  performance:
    # Same command a founder runs locally: npm run perf (Lighthouse + k6 smoke).
    # Bigger load profiles (npm run load -- stress, ...) are run by hand or via /test load.
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1
      - run: node tests/tools/perf.mjs --url "${{ needs.target.outputs.url }}" --out test-results || echo "::warning::performance budgets missed"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-performance
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

  zap:
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          mkdir -p test-results && chmod 777 test-results
          docker run --rm -v "$PWD/test-results:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "${{ needs.target.outputs.url }}" -J zap.json -r zap.html -I || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-zap
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

  android:
    # Builds the APK against this environment's API and runs every Maestro flow
    # on an emulator (results-mobile artifact, merged into the same report).
    needs: target
    permissions:
      contents: read
    uses: ./.github/workflows/mobile.yml
    with:
      environment: ${{ inputs.environment || 'staging' }}

  report:
    needs: [target, web-e2e, performance, zap, android]
    if: always() && needs.target.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: results-*
          path: test-results
          merge-multiple: true
      - env:
          TARGET: ${{ inputs.environment || 'staging' }}
          BASE_URL: ${{ needs.target.outputs.url }}
        run: |
          node tests/tools/collect-results.mjs test-results \
            --env "$TARGET" \
            --base-url "$BASE_URL" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-test-report
          path: |
            test-results/summary.json
            test-results/summary.md
          retention-days: 90
      - name: Open an issue when anything failed
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.environment || 'staging' }}
        run: |
          failed=$(node -p "require('./test-results/summary.json').totals.failed")
          [ "$failed" = "0" ] && exit 0
          gh label create test-failure --color B60205 --force -R "$GITHUB_REPOSITORY" >/dev/null
          gh issue create -R "$GITHUB_REPOSITORY" --label test-failure \
            --title "TEST: $TARGET run $GITHUB_RUN_ID — $failed failing" \
            --body-file test-results/summary.md
          echo "::error::$failed test(s) failed on $TARGET — run /test to log and triage them"
          exit 1
