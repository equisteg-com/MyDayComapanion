name: Deploy

# development -> dev environment, staging -> staging, production -> production.
# Merging the PR into a branch IS the deployment trigger. Production additionally
# requires the merger to be listed in the repository variable RELEASE_APPROVERS
# (comma-separated GitHub logins), because GitHub Free cannot require reviewers
# on private repos.
on:
  push:
    branches: [development, staging, production]
  workflow_dispatch:
    inputs:
      environment:
        description: 'dev | staging | production'
        required: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: env
        run: |
          case "${{ inputs.environment || github.ref_name }}" in
            development|dev) echo "name=dev" >> "$GITHUB_OUTPUT" ;;
            staging)         echo "name=staging" >> "$GITHUB_OUTPUT" ;;
            production)      echo "name=production" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown environment"; exit 1 ;;
          esac

      - name: Check production approver
        if: steps.env.outputs.name == 'production'
        run: |
          echo ",${{ vars.RELEASE_APPROVERS }}," | grep -q ",${{ github.actor }}," \
            || { echo "@${{ github.actor }} is not in RELEASE_APPROVERS"; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present

      - name: Skip if no Worker yet
        id: has_api
        run: test -f apps/api/wrangler.jsonc && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "::notice::apps/api/wrangler.jsonc not found, nothing to deploy"

      - name: Migrate D1 and deploy Worker
        if: steps.has_api.outputs.yes == 'true'
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply DB --env ${{ steps.env.outputs.name }} --remote
          npx wrangler deploy --env ${{ steps.env.outputs.name }}

      - name: Health check (rolls back production on failure)
        if: steps.has_api.outputs.yes == 'true'
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # repository variables: DEV_URL, STAGING_URL, PRODUCTION_URL (no trailing slash)
          URL_DEV: ${{ vars.DEV_URL }}
          URL_STAGING: ${{ vars.STAGING_URL }}
          URL_PRODUCTION: ${{ vars.PRODUCTION_URL }}
        run: |
          case "${{ steps.env.outputs.name }}" in
            dev) url="$URL_DEV" ;; staging) url="$URL_STAGING" ;; production) url="$URL_PRODUCTION" ;;
          esac
          [ -z "$url" ] && { echo "::notice::no URL variable set, skipping health check"; exit 0; }
          for i in 1 2 3; do curl -fsS "$url/api/v1/health" && exit 0; sleep 10; done
          if [ "${{ steps.env.outputs.name }}" = "production" ]; then
            npx wrangler rollback --env production --message "auto-rollback: health check failed" --yes
          fi
          exit 1

      - name: Tag production release
        if: steps.env.outputs.name == 'production'
        run: |
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          git tag "$tag" && git push origin "$tag"

  staging-tests:
    # Functional + non-functional automation on staging after every staging deploy.
    # Results: artifact "staging-test-report"; failures open a "test-failure" issue.
    # Then run /test locally to log bugs in tests/bugs/bug-log.xlsx and pick fixes.
    needs: deploy
    if: github.ref_name == 'staging' && vars.STAGING_URL != ''
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/staging-tests.yml
    with:
      environment: staging
